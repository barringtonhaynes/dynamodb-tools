<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f7fa" />
    <meta
      name="description"
      content="A considered workspace for your local DynamoDB tables. Browse, query, edit, import, and export your data."
    />
    <title>DynamoDB Tools · Your local data workspace</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/navigation-model.js" defer></script>
    <script src="/static/navigation.js" defer></script>
    <script src="/static/local-workspace.js" defer></script>
    <script src="/static/connection.js" defer></script>
    <script src="/static/insights.js" defer></script>
    <script src="/static/query-planner.js" defer></script>
    <script src="/static/copy-data.js" defer></script>
    <script src="/static/workspace.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to workspace</a>
    <aside class="sidebar" id="sidebar">
      <a href="#overview" class="brand" aria-label="DynamoDB Tools home"
        ><span class="brand-mark">d<span>◆</span></span
        ><span>dynamo<span class="brand-sub">TOOLS</span></span></a
      >
      <div class="workspace-card">
        <span class="workspace-symbol" data-icon="database"></span>
        <div>
          <strong id="workspace-name">Local workspace</strong
          ><span id="workspace-description">Development environment</span>
        </div>
        <span class="live-dot"></span>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <div hidden>
        <span id="nav-table-count"></span><span id="activity-dot"></span>
      </div>
      <nav
        aria-label="Workspace explorer"
        id="workspace-navigation"
        class="workspace-explorer"
      ></nav>
      <div class="sidebar-bottom">
        <a href="/docs" target="_blank" rel="noopener"
          ><span data-icon="code"></span>API reference<span
            data-icon="external"
          ></span
        ></a>
        <div class="connection-card">
          <span class="live-dot" id="connection-dot"></span>
          <div>
            <strong id="connection-status">Connecting</strong
            ><small id="connection-region">DynamoDB</small>
          </div>
          <span class="version">DEV</span>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-left">
          <button
            class="icon-button mobile-toggle"
            id="menu-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
          >
            <span data-icon="menu"></span></button
          ><span class="workspace-breadcrumb">Workspace</span
          ><span class="slash">/</span><span id="breadcrumb">Overview</span>
        </div>
        <div class="topbar-right">
          <span class="environment"><span></span> LOCAL DEVELOPMENT</span
          ><button
            class="icon-button"
            id="refresh"
            aria-label="Refresh workspace"
            title="Refresh workspace"
          >
            <span data-icon="refresh"></span></button
          ><span class="avatar" aria-label="Local workspace">L</span>
        </div>
      </header>
      <div id="cloud-notice" class="cloud-notice" role="status" hidden></div>
      <main id="main" tabindex="-1">
        <div class="loading-page">
          <span class="spinner"></span>
          <h1>Opening your workspace</h1>
          <p>Connecting to your DynamoDB instance…</p>
        </div>
      </main>
      <footer class="app-footer">
        <span
          >DynamoDB Tools <span class="footer-dot">·</span> A little more
          clarity for your data.</span
        ><span id="last-sync">Connecting…</span>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
